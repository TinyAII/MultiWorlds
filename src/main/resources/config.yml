# MultiWorlds 多世界插件配置

# 传送门映射：玩家进传送门时被送到哪个世界
# 留空 = 使用原版传送门行为（不接管）
portals:
  nether: ""              # 【全局】所有地狱门 → 该世界（可选，默认留空=原版）
  end: ""                 # 【全局】所有末地门 → 该世界
  custom: {}              # 【绑定传送门】管理员绑定的特定门 → 指定世界（/多世界 传送门 绑定 <世界>）
                          # 玩家自建地狱门不受影响，正常进原版地狱！

# 新世界默认规则（每个世界可单独覆盖，存 worlds.<名字>.rules）
default-rules:
  pvp: true         # 允许 PVP
  monsters: true    # 允许刷怪物
  animals: true     # 允许刷动物
  block-break: true # 允许破坏方块
  fly: true         # 允许飞行

# 世界清单（插件自动维护，一般不用手动改）
worlds: {}